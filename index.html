<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园失物招领</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <!-- 顶部栏 -->
  <div class="topbar"><div class="t-title">校园失物招领</div></div>

  <!-- 统计条：让用户一眼看到平台整体情况 -->
  <div class="stats" id="statsBar"></div>

  <!-- 搜索框：输入即时过滤，右侧出现清空按钮 -->
  <div class="searchbox" id="searchBox">
    <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16" y2="16" stroke="currentColor" stroke-width="2"/></svg>
    <input id="kwInput" type="text" placeholder="搜索物品名称或描述，如：校园卡" autocomplete="off">
    <button class="clear" id="clearBtn" title="清空搜索">×</button>
  </div>

  <!-- 标签页：全部 / 寻物 / 招领 -->
  <div class="tabs">
    <div class="tab on" data-tab="">全部</div>
    <div class="tab" data-tab="lost">寻物</div>
    <div class="tab" data-tab="found">招领</div>
  </div>

  <!-- 筛选面板：类别 / 地点 / 状态，可组合、可一键重置 -->
  <div class="filters">
    <div class="f-row">
      <span class="f-lbl">类别</span>
      <span class="chip on" data-cat="">全部</span>
      <span class="chip" data-cat="校园卡">校园卡</span>
      <span class="chip" data-cat="钥匙">钥匙</span>
      <span class="chip" data-cat="电子产品">电子产品</span>
      <span class="chip" data-cat="书籍">书籍</span>
      <span class="chip" data-cat="衣物">衣物</span>
      <span class="chip" data-cat="其他">其他</span>
    </div>
    <div class="f-row">
      <span class="f-lbl">地点</span>
      <span class="chip on" data-loc="">全部</span>
      <span class="chip" data-loc="教学楼">教学楼</span>
      <span class="chip" data-loc="宿舍区">宿舍区</span>
      <span class="chip" data-loc="食堂">食堂</span>
      <span class="chip" data-loc="图书馆">图书馆</span>
      <span class="chip" data-loc="运动场">运动场</span>
      <span class="chip" data-loc="其他">其他</span>
    </div>
    <div class="f-row">
      <span class="f-lbl">状态</span>
      <span class="chip on" data-st="">全部</span>
      <span class="chip" data-st="active">未解决</span>
      <span class="chip" data-st="resolved">已解决</span>
      <a class="f-reset" id="resetBtn">重置筛选</a>
    </div>
  </div>

  <!-- 信息卡片列表 -->
  <div class="app-body"><div class="cards" id="cardList"></div></div>

  <!-- 底部标签栏 -->
  <div class="tabbar">
    <a class="tbi on" href="index.html">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>首页</span>
    </a>
    <a class="tbi" href="publish.html">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>发布</span>
    </a>
    <a class="tbi" href="myposts.html">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c1.5-3.5 4.5-5 8-5s6.5 1.5 8 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>我的</span>
    </a>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  'use strict';

  Store.ensureSeed();

  /* 当前筛选状态：tab(类型) / keyword / category / location / status */
  var state = { tab: '', keyword: '', category: '', location: '', status: '' };

  /* 支持 ?type=lost|found 直接定位标签页 */
  var params = new URLSearchParams(location.search);
  if (params.get('type') === 'lost' || params.get('type') === 'found') {
    state.tab = params.get('type');
  }

  function renderStats() {
    var s = Store.getStats();
    document.getElementById('statsBar').innerHTML =
      '<div class="s-cell"><div class="s-num">' + s.total + '</div><div class="s-lbl">全部信息</div></div>' +
      '<div class="s-cell"><div class="s-num">' + s.active + '</div><div class="s-lbl">待解决</div></div>' +
      '<div class="s-cell"><div class="s-num">' + s.resolved + '</div><div class="s-lbl">已解决</div></div>' +
      '<div class="s-cell"><div class="s-num">' + s.rate + '%</div><div class="s-lbl">解决率</div></div>';
  }

  function render() {
    /* 组合条件搜索 + 排序（未解决在前、已解决置底） */
    var list = Store.searchItems(state);
    list = Store.sortItems(list);

    var el = document.getElementById('cardList');
    if (!list.length) {
      el.innerHTML = UI.emptyHTML({
        icon: '🔍',
        text: state.keyword || state.category || state.location || state.status
          ? '没有找到符合条件的信息\n换个关键词或筛选条件试试'
          : '还没有任何失物招领信息\n点击下方"发布"发布第一条',
        link: 'publish.html',
        linkText: '去发布'
      });
    } else {
      el.innerHTML = list.map(function (it) { return UI.cardHTML(it); }).join('');
    }
    renderStats();
  }

  /* ---- 事件绑定 ---- */

  /* 搜索：输入即时过滤 */
  var kwInput = document.getElementById('kwInput');
  kwInput.addEventListener('input', function () {
    state.keyword = kwInput.value;
    document.getElementById('searchBox').classList.toggle('has-text', !!kwInput.value);
    render();
  });
  document.getElementById('clearBtn').addEventListener('click', function () {
    kwInput.value = '';
    state.keyword = '';
    document.getElementById('searchBox').classList.remove('has-text');
    render();
  });

  /* 标签页：全部/寻物/招领 */
  document.querySelectorAll('.tabs .tab').forEach(function (tab) {
    tab.addEventListener('click', function () {
      document.querySelectorAll('.tabs .tab').forEach(function (t) { t.classList.remove('on'); });
      tab.classList.add('on');
      state.tab = tab.getAttribute('data-tab');
      render();
    });
  });

  /* 筛选 chips：类别/地点/状态，同类互斥、点击选中 */
  function bindChips(attr, key) {
    document.querySelectorAll('.chip[data-' + attr + ']').forEach(function (chip) {
      chip.addEventListener('click', function () {
        document.querySelectorAll('.chip[data-' + attr + ']').forEach(function (c) { c.classList.remove('on'); });
        chip.classList.add('on');
        state[key] = chip.getAttribute('data-' + attr);
        render();
      });
    });
  }
  bindChips('cat', 'category');
  bindChips('loc', 'location');
  bindChips('st', 'status');

  /* 一键重置筛选 */
  document.getElementById('resetBtn').addEventListener('click', function () {
    state = { tab: state.tab, keyword: state.keyword, category: '', location: '', status: '' };
    document.querySelectorAll('.chip[data-cat],.chip[data-loc],.chip[data-st]').forEach(function (c) {
      c.classList.toggle('on', c.getAttribute('data-cat') === '' ||
        c.getAttribute('data-loc') === '' || c.getAttribute('data-st') === '');
    });
    render();
  });

  /* 点击卡片进入详情页（事件委托，配合 ?id= 传参） */
  document.getElementById('cardList').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (card) location.href = 'detail.html?id=' + encodeURIComponent(card.getAttribute('data-id'));
  });

  /* 标签页初始高亮（?type= 场景） */
  if (state.tab) {
    document.querySelectorAll('.tabs .tab').forEach(function (t) {
      t.classList.toggle('on', t.getAttribute('data-tab') === state.tab);
    });
  }

  render();
})();
</script>
</body>
</html>
